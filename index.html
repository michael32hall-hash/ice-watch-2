<!-- ICE WATCHERS WAIVER FILTER V2 -->
<style>
.waiver-controls{
 display:flex;
 gap:12px;
 align-items:center;
 flex-wrap:wrap;
 margin:12px 0;
 font-size:12px;
}
.waiver-controls select,
.waiver-controls button{
 font:inherit;
 padding:10px;
 border:1px solid var(--line);
 border-radius:5px;
 background:white;
 color:var(--ink);
}
.waiver-settings{margin:12px 0}
.waiver-settings .waiver-body{padding:0 18px 18px}
.waiver-settings textarea{
 width:100%;
 min-height:190px;
 padding:12px;
 font:14px/1.6 monospace;
 border:1px solid var(--line);
 border-radius:5px;
 resize:vertical;
}
.waiver-settings p,
.waiver-status{
 font-size:11px;
 line-height:1.7;
 color:var(--muted);
}
.waiver-hide{
 margin-top:7px;
 font-size:10px;
 border:1px solid var(--line);
 border-radius:4px;
 background:var(--ice);
 padding:5px 8px;
 color:var(--muted);
}
.waiver-sample{
 display:block;
 font-size:10px;
 color:var(--muted);
 margin-top:5px;
}
</style>

<script>
const IW_WAIVERS=(()=>{
 'use strict';

 const storageKey='icewatch-waiver-exclusions-v2';

 /*
  Editorial baseline reviewed September 30, 2026.
  This is an exclusion list, not ownership data.
 */

 const forwards=`Connor McDavid
Nathan MacKinnon
Nikita Kucherov
Leon Draisaitl
David Pastrnak
Kirill Kaprizov
Auston Matthews
Mikko Rantanen
Matthew Tkachuk
Brady Tkachuk
Jack Hughes
Jack Eichel
William Nylander
Mitch Marner
Artemi Panarin
Kyle Connor
Jason Robertson
Sam Reinhart
Sebastian Aho
Aleksander Barkov
Filip Forsberg
Tage Thompson
Nick Suzuki
Cole Caufield
Jake Guentzel
Matt Boldy
Brandon Hagel
Clayton Keller
Tim Stutzle
Connor Bedard
Macklin Celebrini
Sidney Crosby
Alex Ovechkin
Brayden Point
Mark Scheifele
Jesper Bratt
Nico Hischier
Lucas Raymond
Dylan Larkin
Adrian Kempe
Travis Konecny
Wyatt Johnston
Martin Necas
Alex DeBrincat
Andrei Svechnikov
Robert Thomas
Roope Hintz
Seth Jarvis
Kirill Marchenko
Dylan Guenther`.split('\n');

 const defenders=`Cale Makar
Quinn Hughes
Rasmus Dahlin
Evan Bouchard
Zach Werenski
Adam Fox
Roman Josi
Lane Hutson
Josh Morrissey
Moritz Seider
Miro Heiskanen
Mikhail Sergachev
Jake Sanderson
Jakob Chychrun
John Carlson
Erik Karlsson
Victor Hedman
Matthew Schaefer`.split('\n');

 const goalies=`Connor Hellebuyck
Andrei Vasilevskiy
Igor Shesterkin
Ilya Sorokin
Jake Oettinger
Logan Thompson
Jeremy Swayman
Sergei Bobrovsky
Juuse Saros
Linus Ullmark
Jacob Markstrom
Mackenzie Blackwood
Filip Gustavsson
Thatcher Demko
Jesper Wallstedt
Jakub Dobes
Karel Vejmelka
Scott Wedgewood`.split('\n');

 const defaults=[
  ...forwards,
  ...defenders,
  ...goalies
 ].sort((a,b)=>a.localeCompare(b));

 const norm=value=>String(value||'')
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .toLowerCase()
  .replace(/[^a-z0-9 ]/g,'')
  .replace(/\s+/g,' ')
  .trim();

 const aliases={
  'alexander ovechkin':'alex ovechkin',
  'timothy stutzle':'tim stutzle',
  'mitchell marner':'mitch marner',
  'matthew boldy':'matt boldy'
 };

 const canonical=value=>aliases[norm(value)]||norm(value);

 const short=value=>{
  const parts=canonical(value).split(' ');
  return parts.length>1
   ? parts[0][0]+' '+parts.slice(1).join(' ')
   : canonical(value);
 };

 const roleNames={
  skater:new Set([...forwards,...defenders].map(norm)),
  goalie:new Set(goalies.map(norm))
 };

 let entries=[...defaults];
 let notice='';
 let lastCandidates=[];

 try{
  const saved=JSON.parse(localStorage.getItem(storageKey));

  if(
   Array.isArray(saved)&&
   saved.every(value=>typeof value==='string')
  ){
   entries=saved;
  }
 }catch{}

 function excluded(player,group){
  const id=String(player.player_id??'');
  const name=canonical(player.name);
  const abbreviation=short(player.name);

  return entries.some(entry=>{
   const idMatch=entry.match(/^id:(\d+)/i);

   if(idMatch){
    return id===idMatch[1];
   }

   const full=canonical(entry);

   if(roleNames.skater.has(full)&&group!=='skater'){
    return false;
   }

   if(roleNames.goalie.has(full)&&group!=='goalie'){
    return false;
   }

   /*
    Prevent a forward's exclusion from applying to
    a defenseman who shares the same name.
   */
   if(
    (full==='sebastian aho'||full==='elias pettersson')&&
    String(player.pos).toUpperCase()==='D'
   ){
    return false;
   }

   if(full===name){
    return true;
   }

   /*
    Match abbreviated NHL names such as N. MacKinnon.
    Do not match two different full first names.
   */
   const hasInitial=
    name.split(' ')[0].length===1||
    full.split(' ')[0].length===1;

   return hasInitial&&short(full)===abbreviation;
  });
 }

 const rate=(value,low,high)=>
  Math.max(0,Math.min(1,(value-low)/(high-low)));

 function score(player,group){
  const gp=num(player,'gp');

  if(gp<=0){
   return 0;
  }

  if(group==='skater'){
   return (
    30*rate(
     (num(player,'g')+num(player,'a'))/gp,
     .35,
     1.35
    )+
    22*rate(num(player,'sog')/gp,1.5,4.5)+
    14*rate(num(player,'ppp')/gp,0,.75)+
    14*rate(
     (num(player,'hit')+num(player,'blk'))/gp,
     1,
     6
    )+
    4*rate(num(player,'fow')/gp,0,8)+
    8*rate(num(player,'g')/gp,.1,.75)+
    8*Math.min(gp/4,1)
   );
  }

  return (
   (
    known(player,'svPct')
     ? 30*rate(num(player,'svPct'),.890,.940)
     : 0
   )+
   (
    known(player,'gaa')
     ? 20*(1-rate(num(player,'gaa'),1.5,3.5))
     : 0
   )+
   20*rate(num(player,'sv')/gp,18,35)+
   20*rate(num(player,'w')/gp,0,.8)+
   10*Math.min(gp/4,1)
  );
 }

 function candidate(player,group){
  const gp=num(player,'gp');

  if(gp<1||excluded(player,group)){
   return null;
  }

  if(
   group==='goalie'&&
   (
    !known(player,'svPct')||
    !known(player,'gaa')||
    !known(player,'seconds')
   )
  ){
   return null;
  }

  const early=gp<2;

  /*
   Goalies need at least one start.
   Recommended: 90 total minutes.
   One-game early watch: 45 minutes.
  */
  if(
   group==='goalie'&&
   (
    num(player,'seconds')<(early?2700:5400)||
    num(player,'gs')<1
   )
  ){
   return null;
  }

  const recent=score(player,group);

  const month=(monthlyPlayers[group]||[]).find(item=>
   String(item.player_id??item.name)===
   String(player.player_id??player.name)
  );

  const supported=
   month&&
   num(month,'gp')>gp&&
   num(month,'gp')>=(group==='skater'?8:4);

  /*
   The windows overlap. This blend stabilizes recent
   performance rather than adding independent evidence.
  */
  const blended=supported
   ? .7*recent+.3*score(month,group)
   : recent;

  const targetScore=Math.round(
   Math.min(early?49:100,blended)
  );

  const signal=group==='skater'
   ? (
      (num(player,'g')+num(player,'a'))/gp>=.7||
      num(player,'sog')/gp>=3||
      num(player,'ppp')/gp>=.4||
      (num(player,'hit')+num(player,'blk'))/gp>=4||
      num(player,'fow')/gp>=6
     )
   : (
      num(player,'svPct')>=.910&&
      num(player,'gaa')<=3
     );

  if(targetScore<30||!signal){
   return null;
  }

  return {
   ...player,
   _g:group,
   _early:early,
   _targetScore:targetScore,
   _blend:!!supported
  };
 }

 function build(){
  /*
   Use completed games for waiver recommendations.
   Partial live games remain available elsewhere.
  */
  const candidates=['skater','goalie'].flatMap(group=>
   (completedPlayers[group]||[])
    .map(player=>candidate(player,group))
    .filter(Boolean)
  );

  const sort=(a,b)=>
   Number(a._early)-Number(b._early)||
   b._targetScore-a._targetScore||
   num(b,'gp')-num(a,'gp')||
   String(a.name).localeCompare(String(b.name));

  const type=$('waiver-type').value;
  const includeEarly=$('waiver-early').checked;

  const pool=candidates.filter(player=>
   (type==='all'||player._g===type)&&
   (includeEarly||!player._early)
  ).sort(sort);

  if(type!=='all'){
   return pool.slice(0,10);
  }

  function balancedSelection(list){
   const selected=[
    ...list.filter(player=>player._g==='skater').slice(0,7),
    ...list.filter(player=>player._g==='goalie').slice(0,3)
   ];

   const used=new Set(
    selected.map(player=>
     player._g+':'+String(player.player_id??player.name)
    )
   );

   selected.push(
    ...list.filter(player=>
     !used.has(
      player._g+':'+String(player.player_id??player.name)
     )
    ).slice(0,10-selected.length)
   );

   return selected;
  }

  const proven=balancedSelection(
   pool.filter(player=>!player._early)
  );

  return [
   ...proven,
   ...pool
    .filter(player=>player._early)
    .slice(0,10-proven.length)
  ].sort(sort);
 }

 const board=$('targets-board');

 board.querySelector('.report-note').textContent=
  'Established-player exclusions first, then recent-form scoring. '+
  'Completed regular-season games only. '+
  'Ownership and availability are not checked. '+
  'A hot week alone never disqualifies an eligible player.';

 board.querySelector('.board-title span').textContent=
  'ICE WATCHERS TARGET SCORE';

 $('targets-table').querySelector('thead').innerHTML=`
  <tr>
   <th class="player-col">PLAYER</th>
   <th>SAMPLE</th>
   <th class="stat-summary">RECENT STATS</th>
   <th class="target-reason">WHY HE'S HERE</th>
   <th>SCORE / 100</th>
  </tr>
 `;

 const controls=document.createElement('div');

 controls.innerHTML=`
  <div class="waiver-controls">
   <label>
    Show
    <select id="waiver-type">
     <option value="all">Skaters &amp; goalies</option>
     <option value="skater">Skaters</option>
     <option value="goalie">Goalies</option>
    </select>
   </label>

   <label>
    <input type="checkbox" id="waiver-early">
    Include one-game early watch
   </label>
  </div>

  <details class="waiver-settings">
   <summary>View or edit excluded players</summary>

   <div class="waiver-body">
    <p>
     A starting list of established players and priority draft picks,
     reviewed September 30, 2026. It is not an ownership feed.
     Edit one full name per line, then save.
     Hiding a result adds its NHL ID when available.
     Changes apply on this device.
    </p>

    <label for="waiver-exclusions">Excluded players</label>
    <textarea
     id="waiver-exclusions"
     spellcheck="false"
    ></textarea>

    <div class="waiver-controls">
     <button type="button" id="waiver-save">
      Save exclusions
     </button>
     <button type="button" id="waiver-reset">
      Reset baseline
     </button>
    </div>

    <p>
     Recommended: 2+ completed appearances; goalies also need a start
     and 90 minutes played. Minimum score: 30, plus a useful
     statistical signal. Early watch requires one completed
     appearance; goalies need a start and 45 minutes.
     Early scores are capped at 49.
    </p>

    <p>
     Skater weights: points 30%, shots 22%, power play 14%,
     hits + blocks 14%, faceoffs 4%, goals 8%, sample 8%.
     Goalie weights: save percentage 30%, GAA 20%, saves 20%,
     wins 20%, sample 10%.
    </p>

    <p>
     Score: 70% seven-day form and 30% thirty-day form when the
     longer window has enough appearances; otherwise seven-day
     form only. These windows overlap. Scores are heuristics,
     not probabilities or projections. The combined list starts
     with up to seven skaters and three goalies, then fills
     qualifying spaces.
    </p>
   </div>
  </details>

  <p
   class="waiver-status"
   id="waiver-status"
   role="status"
  ></p>
 `;

 board.insertBefore(
  controls,
  board.querySelector('.tablewrap')
 );

 $('waiver-exclusions').value=entries.join('\n');

 function save(){
  try{
   localStorage.setItem(storageKey,JSON.stringify(entries));
   notice='Exclusions saved on this device.';
  }catch{
   notice=
    'Exclusions applied for this visit. '+
    'Your browser could not save them.';
  }
 }

 /*
  Replace only the waiver-table renderer.
  Existing profiles, other rankings and refreshes keep working.
 */
 renderTargets=function(){
  lastCandidates=build();

  const rows=lastCandidates;

  $('waiver-status').textContent=
   `${rows.length} qualifying target${rows.length===1?'':'s'} shown. `+
   `${entries.length} exclusions. ${notice}`;

  $('targets-table').querySelector('tbody').innerHTML=rows.length
   ? rows.map((player,index)=>{
      const info=targetInfo(player);

      const tags=player._early
       ? [
          'EARLY WATCH',
          ...info.tags.filter(tag=>tag!=='HOT GOALIE')
         ].slice(0,3)
       : info.tags;

      const stats=statSummary(player,player._g)+(
       player._g==='goalie'
        ? ' | GAA '+displayStat(player,'gaa')
        : ''
      );

      return `
       <tr>
        <td class="player-col">
         ${playerCell(player,player._g)}

         <button
          type="button"
          class="waiver-hide"
          data-waiver-hide="${index}"
          aria-label="Exclude ${esc(player.name)}"
         >Hide player</button>
        </td>

        <td>
         ${num(player,'gp')} GP
         <span class="waiver-sample">
          ${player._early?'Early watch':'Completed games'}
         </span>
        </td>

        <td class="stat-summary">${stats}</td>

        <td class="target-reason">
         <div class="target-tags">
          ${tags.map(tag=>`
           <span class="target-tag">${esc(tag)}</span>
          `).join('')}
         </div>

         ${esc(info.reason)}

         <span class="waiver-sample">
          ${
           player._blend
            ? '7-day / 30-day blend'
            : '7-day score; limited longer-window sample'
          }
         </span>
        </td>

        <td class="target-score">
         ${player._targetScore}
        </td>
       </tr>
      `;
     }).join('')
   : `
      <tr class="empty-row">
       <td colspan="5">
        <strong>No qualifying targets yet</strong>
        <span>
         Waiting for enough completed-game performance after
         exclusions. The list is not padded with weak recommendations.
        </span>
       </td>
      </tr>
     `;
 };

 $('waiver-type').onchange=renderTargets;
 $('waiver-early').onchange=renderTargets;

 $('waiver-save').onclick=()=>{
  const lines=$('waiver-exclusions').value
   .split('\n')
   .map(value=>value.trim())
   .filter(Boolean);

  entries=[...new Set(lines)];

  save();
  renderTargets();
 };

 $('waiver-reset').onclick=()=>{
  entries=[...defaults];
  $('waiver-exclusions').value=entries.join('\n');

  save();
  renderTargets();
 };

 board.addEventListener('click',event=>{
  const button=event.target.closest?.('[data-waiver-hide]');

  if(!button){
   return;
  }

  const player=lastCandidates[
   Number(button.dataset.waiverHide)
  ];

  if(!player){
   return;
  }

  const id=String(player.player_id??'');

  entries.push(
   /^\d+$/.test(id)
    ? `id:${id} | ${player.name}`
    : String(player.name)
  );

  $('waiver-exclusions').value=entries.join('\n');

  save();
  renderTargets();
 });

 renderTargets();

 return {
  excluded,
  score,
  candidate,
  build,
  defaults
 };
})();
</script>

name: Nightly stats update

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "America/Toronto"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icewatch-nightly-stats
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch regular-season NHL stats
        run: python fetch_nhl_stats.py

      - name: Commit updated data.json
        run: |
          git config user.name "icewatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json

          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "Nightly regular-season data update"
            git push
          fi

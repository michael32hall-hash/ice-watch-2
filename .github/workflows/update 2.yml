name: Near-live stats update

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icewatch-live-stats
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NHL stats
        run: python fetch_nhl_stats.py

      - name: Commit updated data.json
        run: |
          git config user.name "icewatch-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "Near-live NHL data update"
            git push
          fi
